<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Үзлэг">
<title>Үзлэгийн апп</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b3d91'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EҮ%3C/text%3E%3C/svg%3E">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f0f3f8; color: #1a2233; min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #0b3d91 0%, #072a66 100%);
    color: white;
    padding: calc(env(safe-area-inset-top) + 18px) 18px 20px;
    box-shadow: 0 4px 14px rgba(11,61,145,0.25);
    position: sticky; top: 0; z-index: 100;
  }
  header h1 {
    margin: 0; font-size: 20px; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  header .logo {
    width: 34px; height: 34px; background: rgba(255,255,255,0.18);
    border-radius: 10px; display: grid; place-items: center;
    font-size: 18px; font-weight: 800;
  }
  header p { margin: 6px 0 0; font-size: 12.5px; opacity: 0.85; }

  .list {
    padding: 14px 14px calc(env(safe-area-inset-bottom) + 30px);
    display: flex; flex-direction: column; gap: 10px;
  }
  .card {
    background: white; border-radius: 14px;
    padding: 14px 14px 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex; align-items: center; gap: 12px;
    border-left: 4px solid #0b3d91;
    transition: transform 0.1s ease, background 0.15s;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }
  .card:active {
    transform: scale(0.985);
    background: #f8fafd;
  }

  .card-index {
    width: 34px; height: 34px; border-radius: 9px;
    background: #eef3fb; color: #0b3d91;
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px; flex-shrink: 0;
  }

  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-size: 14px; font-weight: 600; line-height: 1.35;
    margin: 0 0 3px; color: #1a2233;
  }
  .card-meta { font-size: 11.5px; color: #6b7280; }

  .icon-btn {
    width: 42px; height: 42px; border-radius: 10px; border: none;
    display: grid; place-items: center; font-size: 17px;
    cursor: pointer; background: #0b3d91; color: white;
    flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(0.9); }

  .footer {
    text-align: center; font-size: 11.5px;
    color: #9aa4b2; padding: 6px 0 20px;
  }

  #toast {
    position: fixed; bottom: calc(env(safe-area-inset-bottom) + 20px);
    left: 50%; transform: translateX(-50%) translateY(120%);
    background: #1a2233; color: white; padding: 12px 20px;
    border-radius: 30px; font-size: 13.5px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    transition: transform 0.3s ease; z-index: 1000;
    max-width: 90%; text-align: center; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1><span class="logo">Ү</span> Үзлэгийн апп</h1>
  <p>Нийт 8 форм · цахилгаан хөдөлгүүрийн үзлэг</p>
</header>

<div class="list" id="list"></div>

<div class="footer">© Үзлэгийн апп · Локал төхөөрөмж дээр ажиллана</div>

<div id="toast"></div>

<script>
const FORMS = [
  { name: "Вагонд ачих байгууламжийн цахилгаан хөдөлгүүрийн үзлэг",
    url: "https://forms.cloud.microsoft/r/xQ5L4F3PSY?origin=lprLink" },
  { name: "Бутлуурын байгууламжийн үзлэг",
    url: "https://forms.cloud.microsoft/r/8sBMwrJ7Rv?origin=lprLink" },
  { name: "Овоолгоос тэжээгчийн (Reclaimer) цахилгаан хөдөлгүүрийн үзлэг",
    url: "https://forms.cloud.microsoft/r/UrEaTteWBn?origin=lprLink" },
  { name: "Овоологчийн (Stacker) цахилгаан хөдөлгүүрийн үзлэг",
    url: "https://forms.cloud.microsoft/r/MhzxXpjLqA?origin=lprLink" },
  { name: "Туузан дамжуургын цахилгаан хөдөлгүүрийн үзлэг",
    url: "https://forms.cloud.microsoft/r/b6rxCtVqvi?origin=lprLink" },
  { name: "Бутлуурын байгууламжийн цахилгаан хөдөлгүүрийн үзлэг",
    url: "https://forms.cloud.microsoft/r/uPz3bV3yGa?origin=lprLink" },
  { name: "Шилжүүлэх байгууламжийн үзлэг (цахилгаан)",
    url: "https://forms.cloud.microsoft/r/yT5LMLgWre?origin=lprLink" },
  { name: "0.4 кВ хаалттай хувиарлах байгууламж (ХХБ)-ийн үзлэг",
    url: "https://forms.cloud.microsoft/r/HL9jWh6g7h?origin=lprLink" }
];

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  FORMS.forEach((f, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-index">${i + 1}</div>
      <div class="card-body">
        <p class="card-title">${f.name}</p>
        <div class="card-meta">Форм нээх</div>
      </div>
      <button class="icon-btn" title="Нээх">↗</button>
    `;
    card.onclick = (e) => {
      e.preventDefault();
      openForm(i);
    };
    list.appendChild(card);
  });
}

function openForm(i) {
  window.open(FORMS[i].url, "_blank");
  toast("Нээгдлээ: " + (i + 1) + "-р форм");
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

if ("serviceWorker" in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() => r)));
    });
  `;
  const blob = new Blob([swCode], { type: "text/javascript" });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}

render();
</script>
</body>
</html>
